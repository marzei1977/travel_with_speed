name: Check Portasplit Stock

on:
  schedule:
    # alle 30 Minuten (UTC)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lagerbestand prüfen
        run: node scripts/check-stock.mjs

      - name: Ergebnis committen
        run: |
          git config user.name "portasplit-stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/status.json
          git commit -m "Aktualisiere Lagerbestand [skip ci]" || echo "Keine Änderungen"
          git push
