name: Routenplaner – Verkehrsdaten aktualisieren

on:
  schedule:
    # Die BASt-Jahresauswertung erscheint einmal jährlich – monatlich nachsehen reicht.
    - cron: "0 4 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: routenplaner-traffic
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: BASt-Zähldaten abrufen
        run: node routenplaner/scripts/fetch-traffic.mjs

      - name: Ergebnis committen
        run: |
          git config user.name "routenplaner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add routenplaner/data/traffic.json
          git commit -m "Routenplaner: Verkehrsdaten aktualisiert [skip ci]" || echo "Keine Änderungen"
          git push
